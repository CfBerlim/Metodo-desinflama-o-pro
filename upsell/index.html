<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07100C">

  <title>Clube Vida Leve · Oferta Exclusiva — Método Desinflamação Pro</title>
  <meta name="description" content="365 dias de refeições anti-inflamatórias prontas. Oferta exclusiva pós-compra do Método Desinflamação Pro.">
  <meta name="robots" content="noindex, nofollow">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../identity/logo/favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,300;1,400;1,500&family=Inter:wght@200;300;400;500;600&family=Italiana&family=Marcellus+SC&display=swap" rel="stylesheet">

  <!-- Sistema visual canônico -->
  <link rel="stylesheet" href="../identity/tokens.css?v=20260507e">

  <!-- Estilos do upsell -->
  <link rel="stylesheet" href="style.css?v=20260507e">
</head>
<body data-mode="apothecary">

  <header class="upsell-topbar">
    <div class="mini-lockup">
      <span class="mini-monogram">M</span>
      <span class="mini-wordmark">Desinflamação</span>
    </div>
    <span class="upsell-status" id="upsell-status"></span>
  </header>

  <main>

    <!-- HERO — sempre visível -->
    <section class="upsell-hero">
      <div class="eyebrow" id="hero-eyebrow"></div>
      <h1 class="manchete" id="hero-manchete"></h1>
      <p class="sub" id="hero-sub"></p>

      <div class="upsell-video-wrapper">
        <div class="upsell-video-frame">
          <iframe
            id="upsell-vsl"
            src=""
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen
            title="Upsell — Clube Vida Leve"></iframe>
        </div>
        <div class="upsell-lock-note" id="hero-lock-note" aria-live="polite"></div>
      </div>
    </section>

    <!-- BLOCO OFERTA + AÇÕES — revelado aos 1:30 (controlado pelo container pai #upsell-below) -->
    <div id="upsell-below" tabindex="-1">

    <section class="upsell-oferta">
      <div class="container">
        <div class="eyebrow" id="oferta-eyebrow"></div>
        <h2 class="titulo" id="oferta-titulo"></h2>
        <div class="titulo-italic" id="oferta-titulo-italic"></div>
        <p class="descricao" id="oferta-descricao"></p>

        <div class="upsell-inclui-titulo" id="inclui-titulo"></div>
        <ul class="upsell-inclui" id="upsell-inclui"></ul>

        <div class="upsell-pricing">
          <div class="contexto" id="pricing-contexto"></div>
          <div class="anchor" id="pricing-anchor"></div>
          <div class="parcelado" id="pricing-parcelado"></div>
          <div class="avista" id="pricing-avista"></div>
          <div class="economia" id="pricing-economia"></div>
        </div>

        <p class="upsell-garantia" id="upsell-garantia"></p>
      </div>
    </section>

    <section class="upsell-actions" id="upsell-actions">
      <a class="btn-yes" id="btn-yes" href="#" rel="noopener">
        <span id="btn-yes-main"></span>
        <span class="sub" id="btn-yes-sub"></span>
      </a>
      <a class="btn-no" id="btn-no" href="#" rel="noopener">
        <span id="btn-no-text"></span>
      </a>
    </section>

    </div>
    <!-- /upsell-below -->

  </main>

  <footer class="upsell-footer">
    <div class="tag">MÉTODO DESINFLAMAÇÃO · PRO · MMXXVI</div>
    <div id="footer-suporte"></div>
  </footer>

  <script src="content.js?v=20260507e"></script>
  <script>
    (function() {
      const cfg = window.UPSELL_CONFIG;
      const C = window.UPSELL_COPY;

      // Topbar
      document.getElementById('upsell-status').textContent = C.topbar.status;

      // Hero
      document.getElementById('hero-eyebrow').textContent = C.hero.eyebrow;
      document.getElementById('hero-manchete').textContent = C.hero.manchete;
      document.getElementById('hero-sub').textContent = C.hero.sub;
      document.getElementById('hero-lock-note').textContent = C.hero.lockNote;

      // Vimeo iframe
      const player = document.getElementById('upsell-vsl');
      player.src = `https://player.vimeo.com/video/${cfg.VIDEO_ID}?title=0&byline=0&portrait=0&badge=0&color=C9A876&autopause=0&dnt=1`;

      // Oferta
      document.getElementById('oferta-eyebrow').textContent = C.oferta.eyebrow;
      document.getElementById('oferta-titulo').textContent = C.oferta.titulo;
      document.getElementById('oferta-titulo-italic').textContent = C.oferta.tituloItalic;
      document.getElementById('oferta-descricao').textContent = C.oferta.descricao;
      document.getElementById('inclui-titulo').textContent = C.oferta.incluiTitulo;
      document.getElementById('upsell-inclui').innerHTML = C.oferta.inclui.map(i => `<li>${i}</li>`).join('');

      // Pricing
      document.getElementById('pricing-contexto').textContent = C.pricing.contexto;
      document.getElementById('pricing-anchor').textContent = C.pricing.valorAncora;
      document.getElementById('pricing-parcelado').textContent = C.pricing.parcelado;
      document.getElementById('pricing-avista').textContent = C.pricing.avista;
      document.getElementById('pricing-economia').textContent = C.pricing.economia;
      document.getElementById('upsell-garantia').textContent = C.garantia;

      // CTA buttons
      const btnYes = document.getElementById('btn-yes');
      btnYes.href = cfg.KIWIFY_ACCEPT_URL;
      document.getElementById('btn-yes-main').textContent = C.cta.aceitar;
      document.getElementById('btn-yes-sub').textContent = C.cta.aceitarSub;

      const btnNo = document.getElementById('btn-no');
      btnNo.href = cfg.KIWIFY_DECLINE_URL;
      document.getElementById('btn-no-text').textContent = C.cta.recusar;

      // Tracking de cliques
      btnYes.addEventListener('click', () => {
        if (window.fbq) {
          try {
            fbq('track', 'Purchase', {
              value: cfg.UPSELL_VALUE,
              currency: cfg.UPSELL_CURRENCY,
              content_name: 'Clube Vida Leve'
            });
          } catch (_) {}
        }
        if (window.dataLayer) {
          window.dataLayer.push({
            event: 'upsell_accept',
            value: cfg.UPSELL_VALUE,
            currency: cfg.UPSELL_CURRENCY
          });
        }
      });
      btnNo.addEventListener('click', () => {
        if (window.fbq) {
          try { fbq('trackCustom', 'UpsellDecline'); } catch (_) {}
        }
        if (window.dataLayer) {
          window.dataLayer.push({ event: 'upsell_decline' });
        }
      });

      // Footer
      document.getElementById('footer-suporte').textContent = `Suporte: ${cfg.SUPPORT_EMAIL}`;
    })();
  </script>

  <!-- Tracking Meta + GTM (mesmo padrão da landing — copia aqui pra ser self-contained) -->
  <script>
    (function() {
      const cfg = window.UPSELL_CONFIG;
      if (cfg.META_PIXEL_ID && cfg.META_PIXEL_ID !== 'XXXXXXXXXXXX') {
        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', cfg.META_PIXEL_ID);
        fbq('track', 'PageView');
      }
      if (cfg.GTM_ID && cfg.GTM_ID !== 'GTM-XXXXXXX') {
        (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer',cfg.GTM_ID);
      } else {
        window.dataLayer = window.dataLayer || [];
      }
    })();
  </script>

  <!-- Vimeo Player SDK + reveal logic -->
  <script src="https://player.vimeo.com/api/player.js" defer></script>
  <script src="reveal.js?v=20260507e" defer></script>

</body>
</html>
